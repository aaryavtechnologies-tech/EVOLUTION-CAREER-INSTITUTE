    </text>

    <!-- Main Title -->
    <text x="0" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="56" letter-spacing="-0.5">
      EVOLUTION
    </text>
    <text x="350" y="115" fill="#D71920" font-family="system-ui, sans-serif" font-weight="900" font-size="64">
      .
    </text>
    <text x="0" y="165" fill="#FFC928" font-family="system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="6">
      CAREER INSTITUTE
    </text>

    <!-- Courses Strip -->
    <text x="0" y="225" fill="#E2E8F0" font-family="system-ui, sans-serif" font-weight="600" font-size="22">
