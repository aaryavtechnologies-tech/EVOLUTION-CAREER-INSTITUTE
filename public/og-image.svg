<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071D43" />
      <stop offset="60%" stop-color="#0B2555" />
      <stop offset="100%" stop-color="#123C78" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#FFC928" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#D71920" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFC928" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#071D43" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#FFC928" stroke-width="2" stroke-opacity="0.3" />

  <!-- Shield Emblem Graphic Left -->
  <g transform="translate(100, 165) scale(2.8)">
    <path d="M50 4 L88 18 C88 56 68 84 50 96 C32 84 12 56 12 18 Z" fill="#04122C" stroke="#FFC928" stroke-width="3" stroke-linejoin="round" />
    <path d="M32 68 L50 54 L68 68" stroke="#FFC928" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M36 58 L50 46 L64 58" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="30" r="10" fill="#D71920" />
    <polygon points="50,22 53,28 60,29 55,34 56,40 50,37 44,40 45,34 40,29 47,28" fill="#FFC928" />
  </g>

  <!-- Text Hierarchy Right -->
  <g transform="translate(420, 150)">
    <!-- Subtitle Pill -->
    <rect x="0" y="0" width="460" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.2" />
    <text x="20" y="25" fill="#FFE066" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" letter-spacing="1.5">
