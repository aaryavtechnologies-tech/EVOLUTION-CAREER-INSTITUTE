      <text x="18" y="31" fill="#071D43" font-family="system-ui, sans-serif" font-weight="bold" font-size="16">
        CALL: +91 6390247880
      </text>
    </g>

    <!-- Campus Location -->
    <text x="0" y="390" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="16">
